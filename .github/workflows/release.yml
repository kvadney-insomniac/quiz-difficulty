# Runs when a version tag is pushed. Verifies the tag names the version in
# package.json and CHANGELOG.md, runs every check, packs the tarball, and
# creates a GitHub Release with the changelog section as its notes.
#
# It does not publish to npm. Publishing is a deliberate manual step:
# `npm publish` from a clean checkout of the tag, which runs prepublishOnly.
#
# Tag a release with:
#   git tag v1.2.3 && git push origin v1.2.3
#
# References:
#   trigger on tags: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#push
#   gh release create: https://cli.github.com/manual/gh_release_create
#   GITHUB_TOKEN permissions: https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Fails if the tag is not v<package.json version> or the changelog has
      # no heading for it. GITHUB_REF is refs/tags/<tag> on this trigger.
      - run: npm run check-version
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Pack the tarball that npm publish would ship
        run: npm pack
      - name: Write release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs > release-notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            quiz-difficulty-*.tgz
